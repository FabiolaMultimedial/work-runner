<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salta el obstáculo</title>
<style>
  body {
    margin: 0;
    background: #87CEEB;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: sans-serif;
    user-select: none;
  }
  canvas {
    background: #fff;
    border: 3px solid #333;
    touch-action: manipulation;
    max-width: 95vw;
  }
  #score {
    font-size: 20px;
    margin-bottom: 8px;
  }
  #msg {
    font-size: 16px;
    color: #333;
    margin-top: 8px;
    text-align: center;
  }
</style>
</head>
<body>

<div id="score">Puntos: 0</div>
<canvas id="game" width="600" height="200"></canvas>
<div id="msg">Toca la pantalla o presiona ESPACIO para saltar</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const msgEl = document.getElementById("msg");

const groundY = 150;

// --- Sprite sheet ---
const sprite = new Image();
sprite.src = "sprite.jpg";

const FRAME_COUNT = 6;
const FRAME_W = 456;
const FRAME_H = 912;

// Tamaño con el que se dibuja el personaje en el canvas (mantiene proporción 1:2)
const DRAW_W = 40;
const DRAW_H = 80;

let currentFrame = 0;
let frameTimer = 0;
const frameInterval = 6; // cada cuantos "ticks" cambia de frame

// Personaje
const player = {
  x: 50,
  y: groundY,
  vy: 0,
  jumping: false
};

const gravity = 0.8;
const jumpForce = -14;

// Obstáculo
let obstacle = {
  x: canvas.width,
  y: groundY + (DRAW_H - 30),
  width: 20,
  height: 30
};

let speed = 5;
let score = 0;
let gameOver = false;
let started = false;

function jump() {
  if (!started) {
    started = true;
    loop();
    return;
  }
  if (gameOver) {
    resetGame();
    return;
  }
  if (!player.jumping) {
    player.vy = jumpForce;
    player.jumping = true;
  }
}

function resetGame() {
  player.y = groundY;
  player.vy = 0;
  player.jumping = false;
  obstacle.x = canvas.width;
  speed = 5;
  score = 0;
  gameOver = false;
  msgEl.textContent = "Toca la pantalla o presiona ESPACIO para saltar";
  loop();
}

document.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    jump();
  }
});
canvas.addEventListener("mousedown", jump);
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  jump();
});

function update() {
  // Física del personaje
  player.vy += gravity;
  player.y += player.vy;
  if (player.y > groundY) {
    player.y = groundY;
    player.vy = 0;
    player.jumping = false;
  }

  // Animación de correr (solo si está en el piso)
  if (!player.jumping) {
    frameTimer++;
    if (frameTimer >= frameInterval) {
      frameTimer = 0;
      currentFrame = (currentFrame + 1) % FRAME_COUNT;
    }
  }

  // Mover obstáculo
  obstacle.x -= speed;
  if (obstacle.x + obstacle.width < 0) {
    obstacle.x = canvas.width + Math.random() * 200;
    score++;
    speed += 0.2;
  }

  // Colisión (hitbox un poco más chica que el sprite completo)
  const px = player.x + 8;
  const pw = DRAW_W - 16;
  const py = player.y + 10;
  const ph = DRAW_H - 10;

  if (
    px < obstacle.x + obstacle.width &&
    px + pw > obstacle.x &&
    py < obstacle.y + obstacle.height &&
    py + ph > obstacle.y
  ) {
    gameOver = true;
    msgEl.textContent = "¡Perdiste! Toca o presiona ESPACIO para reiniciar";
  }

  scoreEl.textContent = "Puntos: " + score;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Suelo
  ctx.fillStyle = "#555";
  ctx.fillRect(0, groundY + DRAW_H, canvas.width, 3);

  // Personaje (recorta el frame actual del sprite sheet)
  const frameToShow = player.jumping ? 0 : currentFrame;
  ctx.drawImage(
    sprite,
    frameToShow * FRAME_W, 0, FRAME_W, FRAME_H,  // recorte del sprite sheet
    player.x, player.y, DRAW_W, DRAW_H            // dibujo en el canvas
  );

  // Obstáculo
  ctx.fillStyle = "#2c3e50";
  ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
}

function loop() {
  if (!started) return;
  if (gameOver) {
    draw();
    return;
  }
  update();
  draw();
  requestAnimationFrame(loop);
}

sprite.onload = () => {
  draw();
  msgEl.textContent = "Toca la pantalla o presiona ESPACIO para empezar";
};
</script>

</body>
</html>
