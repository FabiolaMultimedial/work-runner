<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkRunner</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
  body {
    margin: 0;
    background: #2b2b2b;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: sans-serif;
    user-select: none;
  }
  canvas {
    background: #fff;
    border: 3px solid #333;
    touch-action: manipulation;
    max-width: 95vw;
    height: auto;
  }
  #score {
    font-size: 20px;
    margin-bottom: 8px;
    color: #eee;
  }
  #msg {
    font-size: 15px;
    color: #ccc;
    margin-top: 8px;
    text-align: center;
  }
  #muteBtn {
    margin-top: 10px;
    background: #444;
    color: #eee;
    border: 1px solid #666;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  #muteBtn:hover {
    background: #555;
  }
</style>
</head>
<body>

<div id="score">Puntos: 0</div>
<canvas id="game" width="800" height="450"></canvas>
<div id="msg">Toca la pantalla o presiona ESPACIO para empezar</div>
<button id="muteBtn">🔊 Sonido</button>

<!-- Música de fondo: reemplazá bgmusic.mp3 por tu propio archivo con ese mismo nombre -->
<audio id="bgMusic" src="bgmusic.mp3" loop preload="auto"></audio>
<!-- Sonido de salto opcional con archivo propio: si existe jump.mp3, se usa ese en vez del generado por código -->
<audio id="jumpSound" src="jump.mp3" preload="auto"></audio>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const msgEl = document.getElementById("msg");
const muteBtn = document.getElementById("muteBtn");
const bgMusic = document.getElementById("bgMusic");
const jumpSoundEl = document.getElementById("jumpSound");

// --- Audio ---
let muted = false;
bgMusic.volume = 0.4;

// Si el archivo bgmusic.mp3 no existe todavía, evitamos que tire error en consola
bgMusic.addEventListener("error", () => {
  console.warn("No se encontró bgmusic.mp3 (podés agregarlo a la carpeta del juego).");
});
jumpSoundEl.addEventListener("error", () => {
  // no pasa nada: usamos el sonido generado por código como respaldo
});

// Sonido de salto generado con Web Audio API (funciona sin archivos externos)
let audioCtx = null;
function playGeneratedJumpBeep() {
  if (muted) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(500, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  } catch (e) {
    // si el navegador no soporta Web Audio, no hacemos nada
  }
}

function playJumpSound() {
  if (muted) return;
  // Si hay un jump.mp3 real cargado (duration > 0), lo usamos; si no, el generado
  if (jumpSoundEl.readyState >= 2 && jumpSoundEl.duration > 0) {
    jumpSoundEl.currentTime = 0;
    jumpSoundEl.play().catch(() => {});
  } else {
    playGeneratedJumpBeep();
  }
}

function startMusic() {
  if (muted) return;
  bgMusic.play().catch(() => {
    // el navegador puede bloquear el autoplay hasta que haya interacción;
    // como esto se llama desde jump() (un click/tap/tecla), ya cuenta como interacción.
  });
}

muteBtn.addEventListener("click", () => {
  muted = !muted;
  muteBtn.textContent = muted ? "🔇 Sonido" : "🔊 Sonido";
  if (muted) {
    bgMusic.pause();
  } else if (started && !gameOver) {
    startMusic();
  }
});

const CW = canvas.width;
const CH = canvas.height;

// --- Cargar imágenes ---
function loadImg(src) {
  const img = new Image();
  img.src = src;
  return img;
}

const bgImg = loadImg("background.jpg");
const titleImg = loadImg("title.jpg");
const gameoverImg = loadImg("gameover.jpg");
const spriteImg = loadImg("sprite.png");

const obstacleImgs = [
  loadImg("obs_papeles.png"),
  loadImg("obs_taza.png"),
  loadImg("obs_telefono.png")
];

let allLoaded = false;
let loadedCount = 0;
const totalImgs = 7;
[bgImg, titleImg, gameoverImg, spriteImg, ...obstacleImgs].forEach(img => {
  img.onload = () => {
    loadedCount++;
    if (loadedCount === totalImgs) {
      allLoaded = true;
      draw();
    }
  };
});

// --- Sprite del personaje (6 frames) ---
const FRAME_COUNT = 6;
const FRAME_W = 456;
const FRAME_H = 912;

const DRAW_W = 90;
const DRAW_H = 180;

let currentFrame = 0;
let frameTimer = 0;
const frameInterval = 6;

// Línea de piso: donde apoyan los pies (personaje y obstáculos)
const FEET_Y = 420;
const groundY = FEET_Y - DRAW_H; // "y" superior del personaje cuando está parado

const player = {
  x: 110,
  y: groundY,
  vy: 0,
  jumping: false
};

const gravity = 0.9;
const jumpForce = -23;

// --- Obstáculos ---
// cada obstáculo tiene su propio tamaño de dibujo (se calcula al elegirlo)
function pickObstacleSize(img) {
  const targetH = 95;
  const scale = targetH / img.naturalHeight;
  return { w: img.naturalWidth * scale, h: targetH };
}

let obstacle = {
  imgIndex: 0,
  x: CW + 200,
  y: 0,
  w: 50,
  h: 50
};

function resetObstacle(fromRight) {
  obstacle.imgIndex = Math.floor(Math.random() * obstacleImgs.length);
  const size = pickObstacleSize(obstacleImgs[obstacle.imgIndex]);
  obstacle.w = size.w;
  obstacle.h = size.h;

  // A medida que suben los puntos, el rango de espacio extra se achica
  // (el obstáculo aparece más "pegado" al anterior), con un mínimo para
  // que siempre sea posible reaccionar.
  const maxExtraGap = Math.max(60, 260 - score * 6);
  const extra = Math.random() * maxExtraGap;

  obstacle.x = fromRight ? CW + extra : CW + 100;
  obstacle.y = FEET_Y - obstacle.h; // apoyado en el piso
}

let speed = 6;
let score = 0;
let gameOver = false;
let started = false;

function jump() {
  if (!started) {
    started = true;
    resetObstacle(false);
    msgEl.textContent = "Toca o presiona ESPACIO para saltar";
    startMusic();
    loop();
    return;
  }
  if (gameOver) {
    resetGame();
    return;
  }
  if (!player.jumping) {
    player.vy = jumpForce;
    player.jumping = true;
    playJumpSound();
  }
}

function resetGame() {
  player.y = groundY;
  player.vy = 0;
  player.jumping = false;
  resetObstacle(false);
  speed = 6;
  score = 0;
  gameOver = false;
  started = true;
  msgEl.textContent = "Toca o presiona ESPACIO para saltar";
  bgMusic.currentTime = 0;
  startMusic();
  loop();
}

document.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    jump();
  }
});
canvas.addEventListener("mousedown", jump);
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  jump();
});

function update() {
  player.vy += gravity;
  player.y += player.vy;
  if (player.y > groundY) {
    player.y = groundY;
    player.vy = 0;
    player.jumping = false;
  }

  if (!player.jumping) {
    frameTimer++;
    if (frameTimer >= frameInterval) {
      frameTimer = 0;
      currentFrame = (currentFrame + 1) % FRAME_COUNT;
    }
  }

  obstacle.x -= speed;
  if (obstacle.x + obstacle.w < 0) {
    resetObstacle(true);
    score++;
    speed = Math.min(speed + 0.35, 16); // se acelera hasta un tope jugable
  }

  // Colisión (hitbox algo más chica que el sprite, en proporción)
  const px = player.x + DRAW_W * 0.2;
  const pw = DRAW_W * 0.6;
  const py = player.y + DRAW_H * 0.12;
  const ph = DRAW_H * 0.88;

  const ox = obstacle.x + obstacle.w * 0.15;
  const ow = obstacle.w * 0.7;
  const oy = obstacle.y + obstacle.h * 0.15;
  const oh = obstacle.h * 0.7;

  if (
    px < ox + ow &&
    px + pw > ox &&
    py < oy + oh &&
    py + ph > oy
  ) {
    gameOver = true;
    msgEl.textContent = "¡Perdiste! Toca o presiona ESPACIO para reiniciar";
    bgMusic.pause();
  }

  scoreEl.textContent = "Puntos: " + score;
}

function draw() {
  ctx.clearRect(0, 0, CW, CH);

  if (!allLoaded) return;

  if (!started) {
    ctx.drawImage(titleImg, 0, 0, CW, CH);
    return;
  }

  if (gameOver) {
    ctx.drawImage(gameoverImg, 0, 0, CW, CH);
    return;
  }

  // Fondo
  ctx.drawImage(bgImg, 0, 0, CW, CH);

  // Personaje
  const frameToShow = player.jumping ? 0 : currentFrame;
  ctx.drawImage(
    spriteImg,
    frameToShow * FRAME_W, 0, FRAME_W, FRAME_H,
    player.x, player.y, DRAW_W, DRAW_H
  );

  // Obstáculo
  const obsImg = obstacleImgs[obstacle.imgIndex];
  ctx.drawImage(obsImg, obstacle.x, obstacle.y, obstacle.w, obstacle.h);
}

function loop() {
  if (!started || gameOver) {
    draw();
    return;
  }
  update();
  draw();
  requestAnimationFrame(loop);
}

// dibujar pantalla de título en cuanto cargue todo
const checkReady = setInterval(() => {
  if (allLoaded) {
    draw();
    clearInterval(checkReady);
  }
}, 50);
</script>

</body>
</html>
